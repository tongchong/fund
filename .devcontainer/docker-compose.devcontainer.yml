version: "3"

services:

  fund-dev:
    image: fund-dev
    build:
      context: .
      dockerfile: Dockerfile
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ..:/workspace/fund:cached
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=testfund!
      - REDIS_DB=0
      - JWT_SECRET=efdfeds1243fsdtr
      - NEXT_PUBLIC_USE_MOCK=1

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: mysqlrootpassword
    volumes:
      - "db:/var/lib/mysql"
    ports:
      - 3300:3306

  redis:
    image: redis:alpine
    ports:
      - 6369:6379

volumes:
  db:
