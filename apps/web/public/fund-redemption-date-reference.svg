  <text x="631" y="676" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">《深市》基金日内做T，只要保持开盘份额和收盘份额不变，那持有时间也就不变；沪市没这规则</text>
