  <text x="631" y="623" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">T日：A股交易日下午3点前就是T日，下午3点后就是T+1日。</text>
